<title>Sillage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,600;6..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: a collector's catalogue — perfume-label Bodoni over a quiet pearl ground, accord colours as the only loud thing. */
:root {
  --bg: #f3f2f6;
  --surface: #ffffff;
  --surface-2: #ebe9f0;
  --border: #dddae4;
  --ink: #19171f;
  --ink-2: #4f4b5a;
  --muted: #7a7585;
  --accent: #8a2f58;
  --accent-soft: #f4e5ec;
  --accent-ink: #ffffff;
  --pos: #2a78d6;
  --neg: #c8463c;
  --ok: #2f7d32;
  --danger: #b3261e;
  --warn-bg: #fbefd5;
  --shadow: 0 1px 2px rgb(25 23 31 / 6%), 0 8px 24px rgb(25 23 31 / 6%);
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --sans: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121016; --surface: #1b1820; --surface-2: #25212c; --border: #34303c;
    --ink: #f1eef5; --ink-2: #c5c0cf; --muted: #918b9c;
    --accent: #e48bb1; --accent-soft: #3a2230; --accent-ink: #1d0d15;
    --pos: #3987e5; --neg: #e0645a; --ok: #6cc070; --danger: #f2867e; --warn-bg: #3a3020;
    --shadow: 0 1px 2px rgb(0 0 0 / 35%), 0 8px 28px rgb(0 0 0 / 30%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121016; --surface: #1b1820; --surface-2: #25212c; --border: #34303c;
  --ink: #f1eef5; --ink-2: #c5c0cf; --muted: #918b9c;
  --accent: #e48bb1; --accent-soft: #3a2230; --accent-ink: #1d0d15;
  --pos: #3987e5; --neg: #e0645a; --ok: #6cc070; --danger: #f2867e; --warn-bg: #3a3020;
  --shadow: 0 1px 2px rgb(0 0 0 / 35%), 0 8px 28px rgb(0 0 0 / 30%);
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; }
h1 { font-size: 2.1rem; line-height: 1.1; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; line-height: 1.15; }
h3 { font-size: 1.12rem; }
.wrap { max-width: 1160px; margin: 0 auto; }
.subtle { color: var(--muted); }
.small { font-size: 0.85rem; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg);
  border-bottom: 1px solid var(--border); margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
}
.topbar .wrap { display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--display); font-size: 1.55rem; font-weight: 700; letter-spacing: 0.02em; }
.brand span { font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
.tabs { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.tabs a { padding: 7px 12px; border-radius: 999px; color: var(--ink-2); text-decoration: none; font-weight: 600; white-space: nowrap; font-size: 0.93rem; }
.tabs a:hover { background: var(--surface-2); }
.tabs a.active { background: var(--ink); color: var(--bg); }
main.wrap { padding-block: 24px 80px; }
.view-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }

button, .btn {
  font: inherit; font-weight: 600; cursor: pointer; border-radius: 10px; padding: 9px 16px; border: 1px solid var(--border);
  background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
button:hover, .btn:hover { border-color: var(--muted); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
button.ghost:hover { background: var(--surface-2); }
button.danger { color: var(--danger); }
button.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
button.small, .btn.small { padding: 5px 10px; font-size: 0.85rem; border-radius: 8px; }
button:disabled { opacity: 0.55; cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
  padding: 9px 12px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 70px; }
.field { display: grid; gap: 5px; font-size: 0.85rem; color: var(--ink-2); font-weight: 600; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.form-grid > * { min-width: 0; }
.form-grid .wide { grid-column: 1 / -1; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row.between { justify-content: space-between; }

.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { position: relative; border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 0.88rem; background: var(--surface); color: var(--ink-2); font-weight: 500; }
.seg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 0.85rem; border: 1px solid transparent; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.pos { border-color: color-mix(in srgb, var(--pos) 55%, transparent); background: color-mix(in srgb, var(--pos) 12%, var(--surface)); }
.chip.neg { border-color: color-mix(in srgb, var(--neg) 55%, transparent); background: color-mix(in srgb, var(--neg) 12%, var(--surface)); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 0.76rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.s2 { background: color-mix(in srgb, var(--pos) 24%, var(--surface)); color: var(--ink); }
.pill.s1 { background: color-mix(in srgb, var(--pos) 12%, var(--surface)); color: var(--ink); }
.pill.s-1 { background: color-mix(in srgb, var(--neg) 12%, var(--surface)); color: var(--ink); }
.pill.s-2 { background: color-mix(in srgb, var(--neg) 24%, var(--surface)); color: var(--ink); }
.pill.match { background: var(--accent-soft); color: var(--ink); }
.pill.example { background: var(--warn-bg); color: var(--ink); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; min-width: 0; }
.stack { display: grid; gap: 16px; }
.card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 0.9rem; }
.notice.warn { background: var(--warn-bg); color: var(--ink); }
.notice.err { background: color-mix(in srgb, var(--danger) 13%, var(--surface)); color: var(--ink); }

.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.filters input { flex: 1 1 220px; }
.filters select { width: auto; flex: 0 1 auto; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.frag { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; cursor: pointer; transition: transform .15s; box-shadow: var(--shadow); }
.frag:hover { transform: translateY(-2px); }
@media (prefers-reduced-motion: reduce) { .frag { transition: none; } .frag:hover { transform: none; } }
.label-art { aspect-ratio: 5 / 3; position: relative; display: grid; place-items: center; overflow: hidden; }
.label-art .mono { font-family: var(--display); font-weight: 700; font-size: 2.4rem; color: rgb(255 255 255 / 94%); text-shadow: 0 1px 10px rgb(0 0 0 / 25%); letter-spacing: 0.04em; }
.label-art .tl { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
.label-art .tr { position: absolute; bottom: 10px; right: 10px; }
.frag .body { padding: 12px 14px 14px; display: grid; gap: 6px; flex: 1; align-content: start; }
.frag .name { font-family: var(--display); font-size: 1.25rem; font-weight: 600; line-height: 1.15; }
.frag .meta { color: var(--muted); font-size: 0.85rem; }
.frag .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
.strip { display: flex; height: 7px; border-radius: 4px; overflow: hidden; gap: 2px; }
.strip span { display: block; height: 100%; }
.empty { text-align: center; padding: 56px 20px; }
.empty h2 { margin-bottom: 8px; }

.accords { display: grid; gap: 4px; }
.accord { position: relative; height: 26px; border-radius: 6px; overflow: hidden; background: var(--surface-2); }
.accord .fill { position: absolute; inset: 0 auto 0 0; border-radius: 6px; }
.accord .lbl { position: relative; z-index: 1; line-height: 26px; padding: 0 10px; font-size: 0.85rem; font-weight: 700; color: #fff; text-shadow: 0 0 4px rgb(0 0 0 / 55%); }
.pyramid { display: grid; gap: 12px; }
.pyramid h4 { margin: 0 0 6px; font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.facts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 0.9rem; margin-top: 8px; }
.facts b { color: var(--ink); }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two-col > * { min-width: 0; }
.predict { border-radius: var(--radius); padding: 14px 16px; background: var(--accent-soft); display: grid; gap: 8px; }
.predict .big { font-family: var(--display); font-size: 2.3rem; font-weight: 700; line-height: 1; }

dialog#detail { width: min(880px, calc(100vw - 24px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--border); border-radius: 18px; background: var(--bg); color: var(--ink); }
dialog::backdrop { background: rgb(15 10 20 / 50%); }
.detail { padding: 22px; display: grid; gap: 16px; position: relative; }
.close-x { position: absolute; top: 12px; right: 12px; width: 38px; height: 38px; padding: 0; border-radius: 50%; }
.hero { display: grid; grid-template-columns: 120px 1fr; gap: 18px; align-items: start; padding-right: 40px; }
.hero .label-art { aspect-ratio: 3 / 4; border-radius: 12px; }
.hero .label-art .mono { font-size: 2rem; }
.wear-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.wear-list li { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; font-size: 0.9rem; }
.wear-list .when { font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
.wear-list .what { color: var(--ink-2); flex: 1; min-width: 0; }

.search-hero { display: flex; gap: 10px; }
.search-hero input { font-size: 1.1rem; padding: 14px 16px; border-radius: 12px; }
.search-hero button { padding: 0 22px; border-radius: 12px; white-space: nowrap; }
.loading { display: flex; gap: 12px; align-items: center; color: var(--ink-2); padding: 16px 2px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
.bulk-log { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 4px; font-size: 0.9rem; }
.bulk-log li { display: flex; gap: 8px; }
.bulk-log .st { width: 18px; flex: none; text-align: center; }
.examples { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.summary-card { background: linear-gradient(140deg, var(--accent-soft), var(--surface) 70%); }
.summary-card p { font-family: var(--display); font-size: 1.3rem; line-height: 1.4; margin: 0 0 6px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.kpi .v { font-family: var(--display); font-size: 2rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi .k { color: var(--muted); font-size: 0.85rem; }
.igrid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.igrid > * { min-width: 0; }
.legend { display: flex; gap: 14px; font-size: 0.8rem; color: var(--ink-2); margin-bottom: 8px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.div-chart { display: grid; gap: 3px; }
.div-row { display: grid; grid-template-columns: minmax(80px, 34%) 1fr 1fr 44px; align-items: center; min-height: 24px; }
.div-row:hover { background: var(--surface-2); border-radius: 6px; }
.div-row .lbl { font-size: 0.88rem; padding: 0 8px 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.div-row .lbl small { color: var(--muted); }
.div-row .neg-half { display: flex; justify-content: flex-end; border-right: 1px solid var(--muted); height: 22px; align-items: center; }
.div-row .pos-half { display: flex; height: 22px; align-items: center; }
.div-row .bar { height: 10px; }
.div-row .neg-half .bar { background: var(--neg); border-radius: 4px 0 0 4px; margin-right: 2px; }
.div-row .pos-half .bar { background: var(--pos); border-radius: 0 4px 4px 0; margin-left: 2px; }
.div-row .val { font-size: 0.8rem; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.cols { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; align-items: end; height: 150px; padding-top: 18px; }
.cols .col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; }
.cols .bar { background: var(--pos); border-radius: 4px 4px 0 0; }
.cols .col:hover .bar { filter: brightness(1.15); }
.cols .top { position: absolute; left: 0; right: 0; text-align: center; font-size: 0.75rem; color: var(--ink-2); }
.axis { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; border-top: 1px solid var(--border); padding-top: 4px; font-size: 0.7rem; color: var(--muted); text-align: center; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 2px; border-bottom: 1px solid var(--border); font-size: 0.92rem; align-items: center; }
.list li:last-child { border-bottom: 0; }
.link { cursor: pointer; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--accent); }
.num { color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.num.wrap { white-space: normal; text-align: right; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.tbl th { text-align: left; color: var(--muted); font-weight: 600; font-size: 0.76rem; padding: 4px; border-bottom: 1px solid var(--border); }
.tbl td { padding: 7px 4px; border-bottom: 1px solid var(--border); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.wx-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.wx { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.wx b { font-family: var(--display); font-size: 1.1rem; }
.recs { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.rec { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.rec .name { font-family: var(--display); font-size: 1.15rem; font-weight: 600; }

#tooltip { position: fixed; z-index: 100; pointer-events: none; max-width: 280px; padding: 8px 10px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 0.82rem; line-height: 1.4; }
#toasts { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 200; display: grid; gap: 8px; width: min(460px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.92rem; }
.toast button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 40%, transparent); padding: 4px 10px; }
.toast.err { background: var(--danger); color: #fff; }


/* ---------- AI workspace */
.tabs a.ai-tab { color: var(--accent); }
.tabs a.ai-tab.active { background: var(--accent); color: var(--accent-ink); }
.ai-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.ai-layout > * { min-width: 0; }
.chat-card { display: flex; flex-direction: column; padding: 0; height: min(72vh, 760px); overflow: hidden; }
.chat-log { flex: 1; overflow-y: auto; padding: 18px; display: grid; gap: 14px; align-content: start; }
.chat-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--border); }
.chat-form textarea { resize: none; min-height: 44px; max-height: 180px; }
.chat-card > .notice { margin: 0 12px 12px; }
.chat-empty { text-align: center; padding: 28px 6px; display: grid; gap: 12px; justify-items: center; }
.chat-empty .spark { font-size: 2rem; color: var(--accent); }
.chat-empty .chips { justify-content: center; }
.chip.prompt, .chip.linkchip { cursor: pointer; border: 1px solid var(--border); background: var(--surface); font: inherit; font-size: 0.86rem; color: var(--ink); }
.chip.prompt { padding: 7px 12px; }
.chip.prompt:hover, .chip.linkchip:hover { border-color: var(--accent); }
.msg { display: grid; gap: 6px; }
.msg.user { justify-items: end; }
.msg .bubble { max-width: 92%; padding: 10px 14px; border-radius: 14px; line-height: 1.55; min-width: 0; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--ink); color: var(--bg); border-bottom-right-radius: 4px; white-space: pre-wrap; }
.msg.bot .bubble { background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg-actions { display: flex; gap: 4px; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; }
.step { font-size: 0.8rem; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); }
.step.ok { color: var(--ok); } .step.bad { color: var(--danger); }
.spinner.tiny { width: 11px; height: 11px; border-width: 2px; }
.thinking span { animation: blink 1.2s infinite; }
.thinking span:nth-child(2) { animation-delay: .2s; } .thinking span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .thinking span { animation: none; } }
.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol { margin: 0 0 8px; } .md ul, .md ol { padding-left: 20px; }
.md h4 { font-family: var(--display); margin: 10px 0 4px; font-size: 1.05rem; }
.md code { background: color-mix(in srgb, var(--ink) 8%, transparent); padding: 1px 5px; border-radius: 5px; font-size: 0.88em; }
.insight { display: grid; gap: 6px; }
.insight + .insight { margin-top: 12px; }
.insight.pinned { border-color: var(--accent); }
.insight-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.insight-actions { margin-left: auto; display: flex; gap: 2px; }
.pill.src { background: var(--ink); color: var(--bg); }
.insight-summary { margin: 0; color: var(--ink-2); }
.insight-chart { margin-top: 6px; }
.insight-body summary { cursor: pointer; color: var(--accent); font-size: 0.88rem; font-weight: 600; }
.insight-body .md { margin-top: 8px; font-size: 0.93rem; }
.hbars { display: grid; gap: 4px; }
.hbar { display: grid; grid-template-columns: minmax(80px, 34%) 1fr 56px; gap: 8px; align-items: center; font-size: 0.86rem; }
.hbar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  "omani peruvian provencal sicilian somalian spanish sri lankan tahitian texas tunisian turkish tuscan virginia virginian damask taif may").split(" "));

class TasteModel {

const ranked = (aff, pos, n) => [...aff.values()].filter((a) => (pos ? a.affinity >= LIKE : a.affinity <= -LIKE))

const LOOKUP_SHAPE = `{"found": true, "confidence": "high", "name": "Sauvage", "brand": "Dior", "year": 2015, "concentration": "Eau de Toilette",
 "gender": "Men", "family": "Aromatic Fougere", "perfumers": ["François Demachy"],
 "accords": [{"name": "fresh spicy", "strength": 1.0}, {"name": "amber", "strength": 0.72}],
 "top_notes": ["Calabrian bergamot", "Pepper"], "middle_notes": ["Sichuan Pepper", "Lavender"], "base_notes": ["Ambroxan", "Cedar"],
 "notes": [], "description": "One or two sentences on how it smells.", "longevity": "long lasting", "sillage": "strong",
 "seasons": ["spring", "summer", "day"], "match_note": null, "alternatives": ["Dior Sauvage Elixir", "Dior Sauvage Eau de Parfum"]}`;
const LOOKUP_RULES = `You are the lookup service of a fragrance collector's app. Identify each perfume the user typed and give its composition as Fragrantica lists it.
Rules:
- Text may be misspelled, abbreviated or a nickname (BR540, TV, "the blue Chanel"). If several perfumes fit (flankers, EDT vs EDP), choose the original or most popular unless the text says otherwise, explain the choice in match_note, and put the others in alternatives as "Brand Name" strings.
- Use Fragrantica's main accords, strongest first, with strength 0-1 relative to the strongest (= 1.0), and its top/middle/base notes with Fragrantica's spelling. Use "notes" only when the pyramid is flat.
- Set confidence to "high" only when you know this exact perfume's pyramid well. If you don't recognize the perfume, set found to false, leave the lists empty and say why in match_note. Never invent a composition.
- Use null or [] for anything you are unsure of.`;

async function lookupMany(queries) {
  const r = await S.sample.json(`${LOOKUP_RULES}\n\nThe user typed this list, one perfume per line:\n${queries.map((q, i) => `${i + 1}. ${q}`).join("\n")}\n\nReply with only a JSON array with one object per line, in the same order, each shaped like:\n${LOOKUP_SHAPE}`);
  if (!Array.isArray(r)) throw { code: "invalid_json", message: "Unexpected reply" };
  return r;
}
function sampleError(e) {
  switch (e?.code) {
    case "not_granted": case "sampling_disabled": case "not_declared": case "capability_disabled":
      return "Claude isn't allowed for this page. Allow it from the artifact's Permissions menu to look fragrances up.";
    case "rate_limited": return "You've hit your Claude usage limit for now. Try again in a little while, or enter it manually.";
    case "refused": return "Claude declined that request. Try rephrasing the name.";

function noteChips(notes, aff) {

let prefillValue = null; // set by "Look up & add" on a recommendation

async function doLookup(query) {
  query = String(query || "").trim();
  if (query.length < 2) return;
  const out = $("#lookup-out");
  if (!S.sample) { out.innerHTML = `<div class="notice err">Claude isn't available on this page right now. Enter the fragrance manually instead.</div>`; return; }
  lookupCtl?.abort(); lookupCtl = new AbortController();
  out.innerHTML = `<div class="loading"><span class="spinner"></span><span>Looking up “${esc(query)}”… this takes about 10–30 seconds.</span><button class="small ghost" id="stop">Stop</button></div>`;
  $("#stop").onclick = () => lookupCtl.abort();
  const btn = $("#lookup-btn"); btn.disabled = true;
  try {
    const r = await S.sample.json(`${LOOKUP_RULES}\n\nThe user typed: ${JSON.stringify(query)}\n\nReply with only one JSON object shaped like:\n${LOOKUP_SHAPE}`, { signal: lookupCtl.signal });
    if (!r || typeof r !== "object" || Array.isArray(r)) throw { code: "invalid_json" };
    if (r.found === false || !r.name) {
      out.innerHTML = `<div class="notice err"><b>Couldn't identify “${esc(query)}”.</b> ${esc(r.match_note || "")}<div class="small" style="margin-top:6px">Add the brand, check the spelling, or enter it manually.</div></div>`;
      return;
    }
    preview = { ...cleanDetails(r), source: "claude", confidence: r.confidence, match_note: r.match_note, alternatives: Array.isArray(r.alternatives) ? r.alternatives.slice(0, 5) : [] };
    out.innerHTML = previewCard(preview);
    wirePreview();
  } catch (e) {
    out.innerHTML = e?.code === "cancelled" ? "" : `<div class="notice err">${esc(sampleError(e))}</div>`;
  } finally { btn.disabled = false; }
}

  return `<div class="card">
    <div class="hero" style="padding-right:0">${labelArt(d)}<div><div class="subtle">${esc(d.brand)}</div><h2>${esc(d.name)}</h2>${facts(d)}
      <div class="small subtle" style="margin-top:6px">Identified by Claude · <a href="${esc(fragranticaSearch(d))}" target="_blank" rel="noopener noreferrer">verify on Fragrantica ↗</a></div></div></div>

      ${d.alternatives.length ? `<div class="small"><span class="subtle">Not the one?</span> ${d.alternatives.map((a) => `<button type="button" class="small ghost" data-alt="${esc(a)}">${esc(a)}</button>`).join(" ")}</div>` : ""}

    <div class="two-col" style="margin-top:14px"><div><h3 style="margin-bottom:8px">Main accords</h3>${accordBars(d.accords)}</div><div><h3 style="margin-bottom:8px">Notes</h3>${pyramid(d)}</div></div>

        continue;

      for (let j = 0; j < chunk.length; j++) {

    }

    toast(`Added ${ok} of ${lines.length}`);
  };

/* ============================================================ AI: markdown + charts */
function md(src) {
  const blocks = String(src || "").replace(/\r/g, "").split(/\n{2,}/);
  const inline = (t) => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")

  return blocks.map((b) => {
    const lines = b.split("\n");
    if (/^#{1,4}\s/.test(b)) { const [h, ...rest] = lines; return `<h4>${inline(h.replace(/^#+\s*/, ""))}</h4>${rest.length ? md(rest.join("\n")) : ""}`; }
    if (lines.every((l) => /^\s*[-*•]\s+/.test(l) || !l.trim())) return `<ul>${lines.filter((l) => l.trim()).map((l) => `<li>${inline(l.replace(/^\s*[-*•]\s+/, ""))}</li>`).join("")}</ul>`;
    if (lines.every((l) => /^\s*\d+[.)]\s+/.test(l) || !l.trim())) return `<ol>${lines.filter((l) => l.trim()).map((l) => `<li>${inline(l.replace(/^\s*\d+[.)]\s+/, ""))}</li>`).join("")}</ol>`;
    if (lines.length > 1 && lines.every((l) => /^\s*\|/.test(l))) {
      const rows = lines.filter((l) => !/^\s*\|[\s:|-]+\|\s*$/.test(l)).map((l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim()));
      const [head, ...body] = rows;
      return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    }
    return `<p>${lines.map(inline).join("<br>")}</p>`;
  }).join("");
}
function chartView(c) {
  if (!c || !c.type) return "";
  const title = c.title ? `<div class="small subtle" style="margin-bottom:6px">${esc(c.title)}</div>` : "";
  const unit = c.unit ? (c.unit === "%" ? "%" : ` ${c.unit}`) : "";
  const fmt = (v) => (Number.isInteger(v) || Math.abs(v) >= 100 ? String(Math.round(v * 10) / 10) : Number(v).toFixed(2)) + unit;
  if (c.type === "table" && Array.isArray(c.columns) && Array.isArray(c.rows)) {
    return title + `<div class="tbl-wrap"><table class="tbl"><thead><tr>${c.columns.map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${c.rows.slice(0, 50).map((r) => `<tr>${(r || []).map((v) => `<td class="${typeof v === "number" ? "r" : ""}">${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  const labels = (c.labels || []).slice(0, 40), values = (c.values || []).slice(0, 40).map(Number);
  if (!labels.length || labels.length !== values.length || values.some((v) => !Number.isFinite(v))) return "";
  if (c.type === "line") {
    const W = 560, H = 160, P = 24, n = values.length, max = Math.max(...values), min = Math.min(0, ...values), span = max - min || 1;
    const x = (i) => P + (n === 1 ? (W - 2 * P) / 2 : (i * (W - 2 * P)) / (n - 1)), y = (v) => H - P - ((v - min) / span) * (H - 2 * P);
    const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" "), peak = values.indexOf(max);
    return title + `<svg class="line-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title || "trend")}"><line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" class="axis-line"/>
      <polygon points="${x(0)},${H - P} ${pts} ${x(n - 1)},${H - P}" class="area"/><polyline points="${pts}" class="trend"/>
      ${values.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i === peak ? 5 : 3.5}" class="pt" data-tip="${esc(`${labels[i]}: ${fmt(v)}`)}"/>`).join("")}
      <text x="${x(peak)}" y="${y(max) - 10}" text-anchor="middle" class="lbl">${esc(fmt(max))}</text><text x="${P}" y="${H - 6}" class="lbl">${esc(labels[0])}</text><text x="${W - P}" y="${H - 6}" text-anchor="end" class="lbl">${esc(labels[n - 1])}</text></svg>`;
  }
  const max = Math.max(...values.map(Math.abs), 1e-9);
  if (c.type === "diverging") {
    return title + `<div class="legend"><span><span class="sw" style="background:var(--neg)"></span>Negative</span><span><span class="sw" style="background:var(--pos)"></span>Positive</span></div><div class="div-chart">${labels.map((l, i) => { const v = values[i], pct = Math.round((Math.abs(v) / max) * 100);
      return `<div class="div-row" data-tip="${esc(`${l}: ${fmt(v)}`)}"><span class="lbl">${esc(l)}</span><span class="neg-half">${v < 0 ? `<span class="bar" style="width:${pct}%"></span>` : ""}</span><span class="pos-half">${v > 0 ? `<span class="bar" style="width:${pct}%"></span>` : ""}</span><span class="val">${esc(fmt(v))}</span></div>`; }).join("")}</div>`;
  }
  return title + `<div class="hbars">${labels.map((l, i) => `<div class="hbar" data-tip="${esc(`${l}: ${fmt(values[i])}`)}"><span class="lbl">${esc(l)}</span><span class="track"><span class="bar" style="width:${Math.max(2, Math.round((Math.abs(values[i]) / max) * 100))}%"></span></span><span class="val">${esc(fmt(values[i]))}</span></div>`).join("")}</div>`;
}

/* ============================================================ AI: similarity + wear suggestions (port of app/recommend.py) */
function scentVector(f) {
  const v = new Map();
  for (const [layer, w] of Object.entries(LAYER_WEIGHTS)) for (const n of f[layer] || []) { const k = "n:" + noteKey(n); v.set(k, Math.max(v.get(k) || 0, w)); }
  for (const a of f.accords || []) { const k = "a:" + String(a.name).toLowerCase(); v.set(k, Math.max(v.get(k) || 0, 1.2 * (Number(a.strength) || 1))); }
  return v;
}
function cosine(a, b) {
  let dot = 0; for (const [k, x] of a) if (b.has(k)) dot += x * b.get(k);
  const n = (m) => Math.sqrt([...m.values()].reduce((s, x) => s + x * x, 0));
  return dot && n(a) && n(b) ? dot / (n(a) * n(b)) : 0;
}
function similarTo(target, frags, limit = 5) {
  const tv = scentVector(target);
  return frags.filter((f) => f.id !== target.id).map((f) => {
    const fv = scentVector(f);
    return { name: f.name, brand: f.brand, status: f.status, similarity: +cosine(tv, fv).toFixed(3), shared: [...new Set([...tv.keys()].filter((k) => fv.has(k)).map((k) => k.slice(2)))].slice(0, 8) };
  }).filter((r) => r.similarity > 0).sort((a, b) => b.similarity - a.similarity).slice(0, limit);
}
const WARM_PRIOR = { citrus: 1, aquatic: 1, marine: 0.9, fresh: 0.9, green: 0.7, ozonic: 0.8, aromatic: 0.5, "fresh spicy": 0.5, fruity: 0.4, salty: 0.6,
  vanilla: -0.6, amber: -0.7, oud: -0.8, tobacco: -0.7, leather: -0.6, sweet: -0.5, balsamic: -0.6, "warm spicy": -0.6, smoky: -0.6, honey: -0.5 };
function weatherPrior(w) {
  const k = String(w || "").toLowerCase(), scale = { hot: 1, humid: 1, warm: 0.6, cold: -1, cool: -0.6, rainy: -0.4 }[k];
  return scale === undefined ? null : Object.fromEntries(Object.entries(WARM_PRIOR).map(([a, v]) => [a, v * scale]));
}
function suggestWear(weather, occasion, limit = 3) {
  const frags = enriched(), prior = weatherPrior(weather), occ = String(occasion || "").toLowerCase();
  return frags.filter((f) => WEARABLE.has(f.status) && (f.sentiment ?? 0) >= 0).map((f) => {
    const reasons = [], days = daysSince(f.last_worn), taste = f.score ?? 0.5;
    if (days === null) reasons.push("not worn yet"); else if (days >= 21) reasons.push(`not worn in ${days} days`);
    let fit = 0;
    if (prior) {
      const accs = f.accords || [], tot = accs.reduce((s, a) => s + (Number(a.strength) || 1), 0) || 1;
      fit = accs.reduce((s, a) => s + (prior[a.name] || 0) * (Number(a.strength) || 1), 0) / tot;
      if (fit > 0.25) reasons.push(`suits ${weather} weather`); else if (fit < -0.3) reasons.push(`heavy for ${weather} weather`);
    }
    const go = occ ? S.wears.filter((w) => w.fragrance_id === f.id && String(w.occasion || "").toLowerCase() === occ).length : 0;
    if (go) reasons.push(`a go-to for ${occasion}`);
    if (taste >= 1.5) reasons.push("one of your favourites");
    return { name: f.name, brand: f.brand, score: +(taste + 0.6 * Math.min((days ?? 60) / 21, 2) + 3.5 * fit + Math.min(go, 4) * 0.25).toFixed(2), reasons };
  }).sort((a, b) => b.score - a.score).slice(0, limit);
}

    { name: "wear_history", description: "Wear log entries in the last N days, newest first, with occasion, weather, sprays, enjoyment and compliments.",
      inputSchema: { type: "object", properties: { days: { type: "integer" } } },
      execute: step(() => "Checked your wear log", (i) => S.wears.filter((w) => daysSince(w.worn_on) <= (Number(i.days) || 90)).sort((a, b) => String(b.worn_on).localeCompare(String(a.worn_on))).slice(0, 150)
        .map((w) => ({ date: w.worn_on, fragrance: S.fragrances.find((f) => f.id === w.fragrance_id)?.name, occasion: w.occasion, weather: w.weather, enjoyment: w.enjoyment, compliments: w.compliments }))) },
    { name: "suggest_what_to_wear", description: "Rank owned fragrances to wear now: favourites, bottles not worn lately, fit with the weather (hot, warm, mild, cool, cold, rainy, humid) and the occasion. Returns picks with reasons.",
      inputSchema: { type: "object", properties: { weather: STR, occasion: STR, limit: { type: "integer" } } },
      execute: step(() => "Picked what to wear", (i) => suggestWear(i.weather, i.occasion, Math.min(Number(i.limit) || 3, 8))) },
    { name: "predict_match", description: "Predict how much the person would like ANY fragrance (including ones they don't own) from its composition. Fill in name, brand, accords and the note pyramid from your knowledge of its Fragrantica listing. Returns match %, verdict, the notes driving it and the most similar fragrances they already have.",
      inputSchema: { type: "object", properties: { name: STR, brand: STR, accords: { type: "array", items: { type: "object", properties: { name: STR, strength: { type: "number" } }, required: ["name"] } }, top_notes: STRS, middle_notes: STRS, base_notes: STRS }, required: ["name", "accords"] },
      execute: step((i) => `Checked ${i.name || "a fragrance"} against your taste`, (i) => { const d = { id: "candidate", ...cleanDetails(i) };
        const dup = findDuplicate(d); return { name: d.name, brand: d.brand, predicted_match: S.model.predict(d), already_in_collection: dup ? brief(enriched().find((f) => f.id === dup.id)) : null, similar_owned: similarTo(d, enriched().filter((f) => WEARABLE.has(f.status)), 3) }; }) },
    { name: "publish_insight", description: "Publish a finding to the app's AI insights feed, with an optional chart. Use when the person asks to save or pin something, or after a substantial analysis they asked for. Chart: {type: bar|diverging|line|table, title, labels[], values[], unit} or for table {type:'table', columns[], rows[][]}.",
      inputSchema: { type: "object", properties: { title: STR, summary: STR, body_markdown: STR, chart: { type: "object" }, fragrance_names: STRS }, required: ["title", "summary"] },
      execute: step((i) => `Published “${i.title || "an insight"}” to your feed`, async (i) => {
        if (!S.canWrite) throw new Error("This viewer can't write to the collection");
        const ids = (i.fragrance_names || []).map((n) => findByName(String(n))?.id).filter(Boolean);
        await S.db.collection("insights").add({ title: String(i.title).slice(0, 120), summary: String(i.summary).slice(0, 600), body: i.body_markdown ? String(i.body_markdown).slice(0, 20000) : null,
          chart: i.chart && typeof i.chart === "object" ? i.chart : null, fragrance_ids: ids, source: "Ask Sillage", pinned: false, created_at: new Date().toISOString() });
        return { published: true };
      }) },
    { name: "log_wear", description: "Record that the person wore a fragrance from the collection today (or on date YYYY-MM-DD). Only when they clearly asked.",
      inputSchema: { type: "object", properties: { name: STR, date: STR, occasion: STR, weather: STR, enjoyment: { type: "integer" } }, required: ["name"] },
      execute: step((i) => `Logged a wear of ${i.name || "a fragrance"}`, async (i) => {
        const f = findByName(String(i.name || "")); if (!f) throw new Error(`No fragrance named ${i.name}`);
        await addWear({ fragrance_id: f.id, worn_on: /^\d{4}-\d{2}-\d{2}$/.test(i.date || "") ? i.date : todayISO(), occasion: i.occasion || null, weather: i.weather || null,
          enjoyment: Number.isInteger(i.enjoyment) && Math.abs(i.enjoyment) <= 2 ? i.enjoyment : null });
        return { logged: f.name };
      }) },
  ];
}

/* ============================================================ AI view: chat + feed */
const AI_RULES = `You are Sillage, the AI inside a fragrance collector's personal app. You have tools over their real collection (Fragrantica notes and accords, their ratings from -2 hate to +2 love, and their wear log) and a learned taste model.
- Ground every answer in their data: call tools rather than guessing. collection_overview orients you; taste_profile has learned likes and dislikes; predict_match checks fragrances they don't own (fill in its Fragrantica composition from your knowledge).
- Be a knowledgeable friend at a perfume counter: specific, warm, concise. Name actual fragrances and notes. Use Markdown with short paragraphs and bullets.
- Only log wears when they clearly asked. Use publish_insight when they ask to save or pin something, or after a substantial analysis they asked for, and include a chart when numbers are involved; say that you did.
Today is ${todayISO()}.`;
const PROMPTS = ["What notes do I love, and which bottles prove it?", "Pick something for a cold-weather date tonight", "Would I like Parfums de Marly Layton?",
  "Which bottles am I neglecting?", "Chart my wears per month and save it to my insights", "What gaps does my collection have?"];
const chat = { messages: [], busy: false, ctl: null };
try { chat.messages = JSON.parse(local.get("sillage-chat") || "[]"); } catch { chat.messages = []; }
const saveChat = () => local.set("sillage-chat", JSON.stringify(chat.messages.slice(-30).map(({ role, content, steps, error }) => ({ role, content, steps, error }))));

function renderAI() {
  const root = $("#view-ai");
  if (!gate(root)) return;
  if (!root.dataset.ready) {
    root.dataset.ready = "1";
    root.innerHTML = `
      <div class="view-head"><div><h1>Ask Sillage</h1><div class="subtle">An AI that knows your whole collection, your ratings and every wear, and can save what it finds.</div></div>
        <div class="row"><a class="btn" href="#connect">Connect other AI</a><button class="ghost" id="chat-new">New chat</button></div></div>
      <div class="ai-layout">
        <section class="card chat-card" aria-label="Chat">
          <div id="chat-log" class="chat-log" aria-live="polite"></div>
          <form id="chat-form" class="chat-form"><textarea id="chat-input" rows="1" placeholder="Ask about your fragrances…" aria-label="Message"></textarea><button class="primary" type="submit" id="chat-send">Send</button></form>
          <div id="chat-off" class="notice small" hidden>Claude isn't available on this page right now. Allow it from the artifact's Permissions menu.</div>
        </section>
        <section aria-label="AI insights"><div class="card-head"><h2>AI insights</h2><span class="small subtle" id="feed-count"></span></div><div id="feed"></div></section>
      </div>`;
    $("#chat-form").onsubmit = (e) => { e.preventDefault(); sendChat($("#chat-input").value); };
    $("#chat-input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(e.target.value); } });
    $("#chat-input").addEventListener("input", (e) => { e.target.style.height = "auto"; e.target.style.height = Math.min(e.target.scrollHeight, 180) + "px"; });
    $("#chat-new").onclick = () => { chat.ctl?.abort(); chat.messages = []; saveChat(); drawChat(); };
    $("#chat-log").addEventListener("click", onChatClick);
    $("#feed").addEventListener("click", onFeedClick);
  }
  $("#chat-off").hidden = !!S.sample; $("#chat-send").disabled = !S.sample || !S.canWrite;
  drawChat(); drawFeed();
}
function drawChat() {
  const log = $("#chat-log"); if (!log) return;
  if (!chat.messages.length) {
    log.innerHTML = `<div class="chat-empty"><div class="spark" aria-hidden="true">✦</div><h3>What would you like to know?</h3><div class="chips">${PROMPTS.map((p) => `<button type="button" class="chip prompt" data-prompt="${esc(p)}">${esc(p)}</button>`).join("")}</div></div>`;
    return;
  }
  log.innerHTML = chat.messages.map((m, i) => m.role === "user" ? `<div class="msg user"><div class="bubble">${esc(m.content)}</div></div>` : `<div class="msg bot">
    ${(m.steps || []).length ? `<div class="steps">${m.steps.map((s) => `<span class="step ${s.done ? (s.ok ? "ok" : "bad") : "run"}">${s.done ? (s.ok ? "✓" : "!") : '<span class="spinner tiny"></span>'} ${esc(s.label)}</span>`).join("")}</div>` : ""}
    <div class="bubble md">${m.content ? md(m.content) : m.error ? "" : `<span class="thinking">Thinking<span>.</span><span>.</span><span>.</span></span>`}</div>
    ${m.error ? `<div class="notice err small">${esc(m.error)}</div>` : ""}
    ${m.content && !m.streaming && S.canWrite ? `<div class="msg-actions"><button class="small ghost" data-save="${i}">Save to insights</button></div>` : ""}</div>`).join("");
  log.scrollTop = log.scrollHeight;
}
function onChatClick(e) {
  const p = e.target.closest("[data-prompt]"); if (p) return sendChat(p.dataset.prompt);
  const s = e.target.closest("[data-save]"); if (s) saveAnswer(Number(s.dataset.save), s);
}
async function saveAnswer(i, btn) {
  const a = chat.messages[i], q = chat.messages[i - 1]?.content || "Ask Sillage";
  const plain = a.content.replace(/[#*_`>|]/g, "").replace(/\s+/g, " ").trim();
  btn.disabled = true;
  try { await S.db.collection("insights").add({ title: q.slice(0, 118), summary: plain.slice(0, 280) + (plain.length > 280 ? "…" : ""), body: a.content, chart: null, fragrance_ids: [], source: "Ask Sillage", pinned: false, created_at: new Date().toISOString() }); toast("Saved to your insights"); }
  catch { toast("Couldn't save.", { error: true }); btn.disabled = false; }
}
async function sendChat(text) {
  text = String(text || "").trim();
  if (!text || chat.busy || !S.sample || !S.canWrite) return;
  $("#chat-input").value = ""; $("#chat-input").style.height = "auto";
  const history = chat.messages.filter((m) => m.content).slice(-16).map(({ role, content }) => ({ role, content }));
  chat.messages.push({ role: "user", content: text });
  const bot = { role: "assistant", content: "", steps: [], streaming: true };
  chat.messages.push(bot);
  chat.busy = true; chat.ctl = new AbortController();
  const send = $("#chat-send"); send.textContent = "Stop"; send.type = "button"; send.onclick = () => chat.ctl.abort();
  drawChat();
  const onStep = (label, input) => { const s = { label, input, done: false }; bot.steps.push(s); drawChat(); return (ok) => { s.done = true; s.ok = ok; drawChat(); }; };
  try {
    const limits = await S.sample.limits().catch(() => null);
    let tools = aiTools(onStep);
    if (!limits?.tools) tools = null; else tools = tools.slice(0, limits.tools.maxCount || tools.length);
    const input = [{ role: "user", content: AI_RULES + (tools ? "" : "\n\n(Tools are unavailable in this view: say so and answer from general knowledge.)") }, ...history, { role: "user", content: text }];
    await S.sample(input, { signal: chat.ctl.signal, ...(tools ? { tools } : { cache: false }), onText: ({ text: t }) => { bot.content = t; drawChat(); } });
  } catch (e) {
    if (e?.code !== "cancelled") { if (e?.text) bot.content = e.text; bot.error = sampleError(e); }
  } finally {
    bot.streaming = false; chat.busy = false;
    send.textContent = "Send"; send.type = "submit"; send.onclick = null;
    if (!bot.content && !bot.error) bot.error = "Stopped.";
    saveChat(); drawChat();
  }
}
function drawFeed() {
  const box = $("#feed"); if (!box) return;
  const items = [...S.insightsFeed].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || String(b.created_at).localeCompare(String(a.created_at)));
  $("#feed-count").textContent = items.length ? `${items.length} saved` : "";
  if (!items.length) { box.innerHTML = `<div class="card empty small"><p><b>Nothing here yet.</b></p><p class="subtle">Insights appear here when you save an answer, when Ask Sillage publishes one, or when Claude publishes one from another conversation.</p></div>`; return; }
  const names = new Map(S.fragrances.map((f) => [f.id, f.name]));
  box.innerHTML = items.map((it) => `<article class="card insight ${it.pinned ? "pinned" : ""}">
    <div class="insight-meta"><span class="pill src">${esc(it.source || "AI")}</span><span class="small subtle">${esc(fmtDate(String(it.created_at || "").slice(0, 10)))}</span>${it.pinned ? `<span class="pill match">Pinned</span>` : ""}${it.example ? `<span class="pill example">Example</span>` : ""}
      ${S.canWrite ? `<span class="insight-actions"><button class="ghost small" data-pin="${it.id}">${it.pinned ? "Unpin" : "Pin"}</button><button class="ghost small" data-del-insight="${it.id}" aria-label="Delete insight">✕</button></span>` : ""}</div>
    <h3>${esc(it.title)}</h3><p class="insight-summary">${esc(it.summary)}</p>
    ${it.chart ? `<div class="insight-chart">${chartView(it.chart)}</div>` : ""}
    ${it.body ? `<details class="insight-body"><summary>Read the full analysis</summary><div class="md">${md(it.body)}</div></details>` : ""}
    ${(it.fragrance_ids || []).filter((id) => names.has(id)).length ? `<div class="chips" style="margin-top:8px">${it.fragrance_ids.filter((id) => names.has(id)).map((id) => `<button class="chip linkchip" data-open="${id}">${esc(names.get(id))}</button>`).join("")}</div>` : ""}
  </article>`).join("");
  $$("[data-del-insight]", box).forEach((b) => armed(b, "Delete?", () => S.db.doc(`insights/${b.dataset.delInsight}`).delete()));
}
async function onFeedClick(e) {
  const pin = e.target.closest("[data-pin]");
  if (pin) { const it = S.insightsFeed.find((x) => x.id === pin.dataset.pin); if (it) await S.db.doc(`insights/${it.id}`).update({ pinned: !it.pinned }); return; }
  const f = e.target.closest("[data-open]"); if (f) openDetail(f.dataset.open);
}

/* ============================================================ connect */
const ARTIFACT_URL = "https://claude.ai/artifact/8QaRezX9S7X5LhpyQTmWzb";
const CLAUDE_PROMPT = `Use my Sillage fragrance app at ${ARTIFACT_URL} (read it with the Artifact tool, then use ArtifactData on that URL).
Collections: "fragrances" (name, brand, year, family, status owned|sample|decant|wishlist|tried|sold, sentiment -2 hate..2 love, accords [{name, strength 0-1}], top_notes, middle_notes, base_notes, notes, perfumers, personal_notes) and "wears" (fragrance_id, worn_on YYYY-MM-DD, occasion, weather, sprays, enjoyment -2..2, compliments).
Analyse my taste, then publish your key findings to the "insights" collection as documents {title, summary, body (markdown), chart {type: bar|diverging|line|table, title, labels, values, unit} or {type: "table", columns, rows}, fragrance_ids, source: "Claude", pinned: false, created_at: ISO timestamp} so they show up in the app's AI insights feed.`;
function renderConnect() {
  const root = $("#view-connect");
  if (!gate(root)) return;
  root.innerHTML = `
    <div class="view-head"><div><h1>Connect your AI</h1><div class="subtle">Your collection is data other AI can analyse, and the results come back into this app.</div></div></div>
    <div class="stack">
      <div class="card"><h3>Claude, from any conversation</h3>
        <p class="small subtle">Claude conversations with artifact tools (Claude Code, claude.ai) can read this collection and publish findings into your AI insights feed, as you. Paste this:</p>
        <div class="snippet"><div class="row between"><b class="small">Prompt</b><button class="small" id="copy-prompt">Copy</button></div><pre id="prompt-text">${esc(CLAUDE_PROMPT)}</pre></div></div>
      <div class="card"><h3>ChatGPT, Cursor, scripts and any other AI app</h3>
        <p class="small subtle" style="margin:0">For those, run the Sillage server (the Python app in this project). It serves the same collection as an <b>MCP server</b> (<code>/mcp</code>) and a <b>REST API</b> with OpenAPI docs (<code>/docs</code>), with 14 tools including read-only SQL. Its own Connect page gives copy-paste setup for Claude Desktop, Claude Code, claude.ai and ChatGPT connectors, Custom GPTs and curl. Deploying it to a public URL takes about four commands (see the README).</p></div>
      <div class="card"><h3>What the assistant here can do</h3><ul class="list">${aiTools(() => () => {}).map((t) => `<li><span><code>${esc(t.name)}</code><br><span class="small subtle">${esc(t.description.split(". ")[0])}</span></span><span class="pill">${["publish_insight", "log_wear"].includes(t.name) ? "write" : "read"}</span></li>`).join("")}</ul></div>
    </div>`;
  $("#copy-prompt").onclick = () => { const p = navigator.clipboard?.writeText(CLAUDE_PROMPT) || Promise.reject(); p.then(() => toast("Copied"), () => { const r = document.createRange(); r.selectNodeContents($("#prompt-text")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Selected. Press Ctrl/Cmd+C to copy"); }); };
}

/* ============================================================ tooltip */
const tip = $("#tooltip");
document.addEventListener("pointermove", (e) => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = "";
  el.dataset.tip.split("\n").forEach((line, i) => { if (i) tip.append(document.createElement("br")); tip.append(line); });
  tip.hidden = false;
  const { width, height } = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + width > innerWidth - 8) x = e.clientX - width - 14;
  if (y + height > innerHeight - 8) y = e.clientY - height - 14;
  tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
});

/* ============================================================ boot */
route();
(async () => {
  const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
  S.sample = sample;
  if (!db) { S.status = "nodb"; route(); return; }
  S.db = db;
  let can = null;
  try { can = user ? ((await user.isOwner()) || (await user.can("data.write"))) : null; } catch { can = null; }
  S.canWrite = can !== false;
  const fail = () => { S.status = "nodb"; route(); };
  db.collection("fragrances").onSnapshot((snap) => {
    S.fragrances = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.loaded.f = true; maybeReady();
  }, fail);
  db.collection("wears").onSnapshot((snap) => {
    S.wears = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.loaded.w = true; maybeReady();
  }, fail);
  db.collection("insights").onSnapshot((snap) => { S.insightsFeed = snap.docs.map((d) => ({ id: d.id, ...d.data() })); if (S.status === "ready" && current() === "ai") drawFeed(); }, () => {});
  db.doc("profile/latest").onSnapshot((d) => { S.profile = d.exists ? d.data() : null; if (S.status === "ready" && current() === "insights" && $("#ai-card")?.dataset.busy !== "1") renderInsights(); }, () => {});
  function maybeReady() {
    if (S.status !== "ready" && S.loaded.f && S.loaded.w) { S.status = "ready"; route(); return; }
    if (S.status === "ready") { onData(); if (detailId && !$("#detail-body #personal:focus-within") && !$("#detail-body .wear-form:focus-within") && !$("#edit-form")) { const f = findFrag(detailId); if (f) { $("#detail-body").innerHTML = detailView(f); wireDetail(f); } } }
  }
})();
</script>
