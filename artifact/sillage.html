<style>
/* Layout: a collector's catalogue — perfume-label Bodoni over a quiet pearl ground, accord colours as the only loud thing. */

  --warn-bg: #fbefd5;

    --ink: #f1eef5; --ink-2: #c5c0cf; --muted: #918b9c;
    --accent: #e48bb1; --accent-soft: #3a2230; --accent-ink: #1d0d15;
    --pos: #3987e5; --neg: #e0645a; --ok: #6cc070; --danger: #f2867e; --warn-bg: #3a3020;
    --shadow: 0 1px 2px rgb(0 0 0 / 35%), 0 8px 28px rgb(0 0 0 / 30%);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121016; --surface: #1b1820; --surface-2: #25212c; --border: #34303c;
  --ink: #f1eef5; --ink-2: #c5c0cf; --muted: #918b9c;
  --accent: #e48bb1; --accent-soft: #3a2230; --accent-ink: #1d0d15;
  --pos: #3987e5; --neg: #e0645a; --ok: #6cc070; --danger: #f2867e; --warn-bg: #3a3020;
  --shadow: 0 1px 2px rgb(0 0 0 / 35%), 0 8px 28px rgb(0 0 0 / 30%);

* { box-sizing: border-box; }
body {

.wrap { max-width: 1160px; margin: 0 auto; }

.pyramid { display: grid; gap: 12px; }

.loading { display: flex; gap: 12px; align-items: center; color: var(--ink-2); padding: 16px 2px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }

@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }

.summary-card { background: linear-gradient(140deg, var(--accent-soft), var(--surface) 70%); }
.summary-card p { font-family: var(--display); font-size: 1.3rem; line-height: 1.4; margin: 0 0 6px; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }

    <div class="examples"><span class="small subtle">Try:</span>${["Baccarat Rouge 540", "Creed Aventus", "tobaco vanile", "Bleu de Chanel EDP", "Le Labo Santal 33"].map((x) => `<button class="small ghost" type="button" data-try="${esc(x)}">${esc(x)}</button>`).join("")}</div>
    <div id="lookup-out" style="margin-top:18px"></div>
    <div class="row" style="margin-top:22px;gap:8px"><button class="ghost" id="manual-btn" type="button">Enter one manually</button><button class="ghost" id="bulk-btn" type="button">Add many at once</button></div>
    <div id="extra-out" style="margin-top:12px"></div>`;

  $("#manual-btn").onclick = () => showManual();

  prefillValue = null;
  if (pending) { $("#lookup-q").value = pending; doLookup(pending); }
}
let prefillValue = null; // set by "Look up & add" on a recommendation

async function doLookup(query) {
  query = String(query || "").trim();
  if (query.length < 2) return;
  const out = $("#lookup-out");
  if (!S.sample) { out.innerHTML = `<div class="notice err">Claude isn't available on this page right now. Enter the fragrance manually instead.</div>`; return; }
  lookupCtl?.abort(); lookupCtl = new AbortController();
  out.innerHTML = `<div class="loading"><span class="spinner"></span><span>Looking up “${esc(query)}”… this takes about 10–30 seconds.</span><button class="small ghost" id="stop">Stop</button></div>`;
  $("#stop").onclick = () => lookupCtl.abort();
  const btn = $("#lookup-btn"); btn.disabled = true;
  try {
    const r = await S.sample.json(`${LOOKUP_RULES}\n\nThe user typed: ${JSON.stringify(query)}\n\nReply with only one JSON object shaped like:\n${LOOKUP_SHAPE}`, { signal: lookupCtl.signal });
    if (!r || typeof r !== "object" || Array.isArray(r)) throw { code: "invalid_json" };
    if (r.found === false || !r.name) {
      out.innerHTML = `<div class="notice err"><b>Couldn't identify “${esc(query)}”.</b> ${esc(r.match_note || "")}<div class="small" style="margin-top:6px">Add the brand, check the spelling, or enter it manually.</div></div>`;
      return;
    }
    preview = { ...cleanDetails(r), source: "claude", confidence: r.confidence, match_note: r.match_note, alternatives: Array.isArray(r.alternatives) ? r.alternatives.slice(0, 5) : [] };
    out.innerHTML = previewCard(preview);
    wirePreview();
  } catch (e) {
    out.innerHTML = e?.code === "cancelled" ? "" : `<div class="notice err">${esc(sampleError(e))}</div>`;
  } finally { btn.disabled = false; }
}
function previewCard(d) {
  const dup = findDuplicate(d);
  const pred = S.model?.predict(d);
  const conf = d.confidence && d.confidence !== "high" ? `<div class="notice warn">Claude is only ${esc(d.confidence)}-confidence on this composition. <a href="${esc(fragranticaSearch(d))}" target="_blank" rel="noopener noreferrer">Check it on Fragrantica ↗</a> and fix anything that's off.</div>` : "";
  return `<div class="card">
    <div class="hero" style="padding-right:0">${labelArt(d)}<div><div class="subtle">${esc(d.brand)}</div><h2>${esc(d.name)}</h2>${facts(d)}
      <div class="small subtle" style="margin-top:6px">Identified by Claude · <a href="${esc(fragranticaSearch(d))}" target="_blank" rel="noopener noreferrer">verify on Fragrantica ↗</a></div></div></div>
    <div class="stack" style="margin-top:14px;gap:10px">
      ${d.match_note ? `<div class="notice">${esc(d.match_note)}</div>` : ""}${conf}
      ${dup ? `<div class="notice warn">Already in your collection. <span class="link" data-open="${dup.id}">Open it</span></div>` : ""}
      ${d.alternatives.length ? `<div class="small"><span class="subtle">Not the one?</span> ${d.alternatives.map((a) => `<button type="button" class="small ghost" data-alt="${esc(a)}">${esc(a)}</button>`).join(" ")}</div>` : ""}
      ${pred ? predictionBox(pred, "Based on your taste so far") : ""}
    </div>
    ${d.description ? `<p class="subtle">${esc(d.description)}</p>` : ""}
    <div class="two-col" style="margin-top:14px"><div><h3 style="margin-bottom:8px">Main accords</h3>${accordBars(d.accords)}</div><div><h3 style="margin-bottom:8px">Notes</h3>${pyramid(d)}</div></div>
    <form id="save-form" class="card" style="margin-top:16px;background:var(--surface-2);border:0">
      <div class="form-grid">
        <label class="field">Status ${statusSelect("status", "owned", "p-status")}</label>
        <label class="field">Bottle size (ml) <input id="p-ml" name="bottle_ml" type="number" min="0" step="any"></label>
        <div class="field wide">How do you feel about it? ${sentimentRadios("p-sent", null)}</div>
        <label class="field wide">Your notes <input id="p-notes" name="personal_notes" placeholder="Optional"></label>
      </div>
      <div class="row end" style="margin-top:12px"><button type="button" data-act="fix">Fix details first</button><button class="primary" type="submit">${dup ? "Add anyway" : "Add to collection"}</button></div>
    </form></div>`;
}
function wirePreview() {
  const out = $("#lookup-out");
  $$("[data-alt]", out).forEach((b) => (b.onclick = () => { $("#lookup-q").value = b.dataset.alt; doLookup(b.dataset.alt); }));
  $$("[data-open]", out).forEach((b) => (b.onclick = () => openDetail(b.dataset.open)));
  $('[data-act="fix"]', out).onclick = () => showManual(preview);
  $("#save-form").onsubmit = async (e) => {
    e.preventDefault();
    const form = e.target, fd = new FormData(form);
    await saveNew(preview, { status: fd.get("status"), sentiment: readSentiment(form, "p-sent"), bottle_ml: fd.get("bottle_ml") ? Number(fd.get("bottle_ml")) : null, personal_notes: fd.get("personal_notes") || null });
  };
}
async function saveNew(details, personal) {
  try {
    const id = await addFragrance(details, personal);
    $("#lookup-out").innerHTML = ""; $("#extra-out").innerHTML = ""; $("#lookup-q").value = ""; preview = null;
    toast(`Added ${details.name}`, { action: "View", onAction: () => openDetail(id) });
    $("#lookup-q").focus();
  } catch { toast("Couldn't save. Check your connection and try again.", { error: true }); }
}
function showManual(d) {

  box.innerHTML = `<form class="card" id="manual-form"><h3 style="margin-bottom:12px">${d ? "Check the details" : "Enter a fragrance manually"}</h3>${detailsFields(d || {}, "m")}

function showBulk() {
  const box = $("#extra-out");
  box.innerHTML = `<form class="card" id="bulk-form"><h3>Add many at once</h3>
    <p class="subtle small">One fragrance per line. Claude looks them up in batches of eight and saves each one; duplicates are skipped.</p>
    <textarea id="bulk-lines" name="lines" rows="8" placeholder="Dior Sauvage EDT&#10;Creed Aventus&#10;MFK Baccarat Rouge 540"></textarea>
    <div class="form-grid" style="margin-top:12px"><label class="field">Status for all ${statusSelect("status", "owned", "b-status")}</label></div>
    <div class="row end" style="margin-top:12px"><button class="primary" type="submit">Look up and add</button></div><ul class="bulk-log" id="bulk-log"></ul></form>`;
  $("#bulk-form").onsubmit = async (e) => {
    e.preventDefault();
    if (!S.sample) { toast("Claude isn't available on this page right now.", { error: true }); return; }
    const fd = new FormData(e.target);
    const lines = [...new Set(String(fd.get("lines")).split("\n").map((l) => l.trim()).filter((l) => l.length > 1))].slice(0, 80);
    if (!lines.length) return;
    const status = fd.get("status"), btn = e.target.querySelector("button[type=submit]"), log = $("#bulk-log");
    btn.disabled = true;
    log.innerHTML = lines.map((l, i) => `<li data-i="${i}"><span class="st">·</span><span>${esc(l)}</span></li>`).join("");
    let ok = 0;
    for (let start = 0; start < lines.length; start += 8) {
      const chunk = lines.slice(start, start + 8);
      chunk.forEach((_, j) => (log.querySelector(`[data-i="${start + j}"] .st`).innerHTML = `<span class="spinner" style="width:13px;height:13px"></span>`));
      let results;
      try { results = await lookupMany(chunk); }
      catch (err) {
        chunk.forEach((l, j) => (log.querySelector(`[data-i="${start + j}"]`).innerHTML = `<span class="st" style="color:var(--danger)">✗</span><span>${esc(l)} — <span class="subtle">${esc(sampleError(err))}</span></span>`));
        if (["not_granted", "rate_limited", "sampling_disabled"].includes(err?.code)) break;
        continue;
      }
      for (let j = 0; j < chunk.length; j++) {
        const li = log.querySelector(`[data-i="${start + j}"]`), r = results[j];
        if (!r || r.found === false || !r.name) { li.innerHTML = `<span class="st" style="color:var(--danger)">✗</span><span>${esc(chunk[j])} — <span class="subtle">${esc(r?.match_note || "not recognized")}</span></span>`; continue; }
        const d = cleanDetails(r);
        if (findDuplicate(d)) { li.innerHTML = `<span class="st subtle">=</span><span>${esc(chunk[j])} — <span class="subtle">already in your collection</span></span>`; continue; }
        try {
          await addFragrance({ ...d, source: "claude" }, { status });
          ok++;
          li.innerHTML = `<span class="st" style="color:var(--ok)">✓</span><span>${esc(chunk[j])} → <b>${esc(fullName(d))}</b>${r.confidence && r.confidence !== "high" ? ` <span class="subtle">(${esc(r.confidence)} confidence — worth checking)</span>` : ""}</span>`;
        } catch { li.innerHTML = `<span class="st" style="color:var(--danger)">✗</span><span>${esc(chunk[j])} — <span class="subtle">couldn't save</span></span>`; }
      }
    }
    btn.disabled = false;
    toast(`Added ${ok} of ${lines.length}`);
  };
}

function suggest() {
  const pool = enriched().filter((f) => WEARABLE.has(f.status) && (f.sentiment ?? 0) >= 0)
    .map((f) => ({ f, s: (f.score ?? 0.5) + Math.min((daysSince(f.last_worn) ?? 60) / 21, 2) + Math.random() * 0.6 }))
    .sort((a, b) => b.s - a.s).slice(0, 3);
  const out = $("#suggest-out");
  out.innerHTML = pool.length ? `<div class="card" style="margin-bottom:16px"><div class="card-head"><h3>Today, maybe…</h3><button class="small ghost" id="shuffle">Shuffle</button></div>
    <p class="small subtle" style="margin-top:-6px">Favourites you haven't worn lately.</p><div class="grid">${pool.map(({ f }) => card(f)).join("")}</div></div>` : `<div class="notice">Rate a few fragrances first.</div>`;

function divergingChart(rows, empty) {
  if (!rows.length) return `<p class="subtle small">${esc(empty)}</p>`;
  const max = Math.max(...rows.map((r) => Math.abs(r.affinity)), 0.5);
  return `<div class="legend"><span><span class="sw" style="background:var(--neg)"></span>Avoid</span><span><span class="sw" style="background:var(--pos)"></span>Love</span></div>
  <div class="div-chart">${rows.map((r) => {
    const pct = Math.round((Math.abs(r.affinity) / max) * 100);
    const tip = `${r.label}: ${signed(r.affinity)} · in ${r.count} fragrance${r.count === 1 ? "" : "s"}\n` + r.fragrances.slice(0, 6).map((f) => `• ${f.name} (${f.score >= 0 ? "+" : ""}${f.score.toFixed(1)})`).join("\n");
    return `<div class="div-row" data-tip="${esc(tip)}"><span class="lbl">${esc(r.label)} <small>×${r.count}</small></span>
      <span class="neg-half">${r.affinity < 0 ? `<span class="bar" style="width:${pct}%"></span>` : ""}</span>
      <span class="pos-half">${r.affinity > 0 ? `<span class="bar" style="width:${pct}%"></span>` : ""}</span><span class="val">${signed(r.affinity)}</span></div>`;
  }).join("")}</div>`;
}
function columnChart(months) {
  const max = Math.max(...months.map((m) => m.count), 1);
  const peak = months.reduce((a, b) => (b.count > a.count ? b : a), months[0]);
  const nm = (k) => new Date(k + "-01T00:00:00").toLocaleDateString(undefined, { month: "short" });
  return `<div class="cols">${months.map((m) => { const h = (m.count / max) * 100;
    return `<div class="col" data-tip="${esc(`${nm(m.month)} ${m.month.slice(0, 4)}: ${m.count} wear${m.count === 1 ? "" : "s"}`)}">${m === peak && m.count ? `<span class="top" style="bottom:calc(${h}% + 2px)">${m.count}</span>` : ""}<div class="bar" style="height:${h}%"></div></div>`; }).join("")}</div>
    <div class="axis">${months.map((m) => `<span>${nm(m.month)}</span>`).join("")}</div>`;
}
const linkList = (rows, right) => (rows.length ? `<ul class="list">${rows.map((r) => `<li><span class="link" data-open="${r.id}">${esc(r.name)} <span class="subtle small">${esc(r.brand || "")}</span></span><span class="num">${right(r)}</span></li>`).join("")}</ul>` : `<p class="subtle small">Nothing yet.</p>`);
const scoreCell = (v) => (v === null ? `<span class="subtle">—</span>` : `<span style="color:${v >= LIKE ? "var(--pos)" : v <= -LIKE ? "var(--neg)" : "var(--ink-2)"}">${signed(v)}</span>`);
const groupTable = (title, rows) => (rows.length ? `<div class="card"><h3 style="margin-bottom:8px">${esc(title)}</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th class="r">Count</th><th class="r">Avg score</th></tr></thead><tbody>${rows.slice(0, 10).map((g) => `<tr><td>${esc(g.label)}</td><td class="r">${g.count}</td><td class="r">${scoreCell(g.avg)}</td></tr>`).join("")}</tbody></table></div></div>` : "");

      <div class="chips" style="margin:10px 0 16px">${(p.signature_traits || []).map((x) => `<span class="chip">${esc(x)}</span>`).join("")}</div>
      <h3 style="margin-bottom:8px">Try next</h3>
      <div class="recs">${(p.recommendations || []).map((x) => `<div class="rec"><div class="subtle small">${esc(x.brand)}</div><div class="name">${esc(x.name)}</div><div class="small">${esc(x.why)}</div>${noteChips(x.key_notes)}${S.canWrite ? `<div><button class="small" data-lookup="${esc(`${x.brand} ${x.name}`)}">Look up & add</button></div>` : ""}</div>`).join("")}</div>
      <div class="two-col" style="margin-top:16px">
        <div><h3>Probably skip</h3><ul class="list">${(p.avoid || []).map((x) => `<li><span><b>${esc(x.brand)} ${esc(x.name)}</b><br><span class="small subtle">${esc(x.why)}</span></span></li>`).join("")}</ul></div>
        <div><h3>Gaps in your collection</h3><ul class="list">${(p.collection_gaps || []).map((g) => `<li><span>${esc(g)}</span></li>`).join("")}</ul></div>
      </div>`;
  }
  $$("[data-lookup]", box).forEach((b) => (b.onclick = () => { prefillValue = b.dataset.lookup; $("#view-add").dataset.ready = ""; location.hash = "add"; }));
  const ab = $("#ai-btn", box);
  if (ab) ab.onclick = async () => {
    box.dataset.busy = "1";
    box.innerHTML = `<div class="loading"><span class="spinner"></span>Claude is writing your profile… this can take a minute.</div>`;
    const slim = (rows) => rows.map((a) => ({ label: a.label, affinity: a.affinity, count: a.count, in: a.fragrances.slice(0, 4).map((f) => `${f.brand} ${f.name}`) }));
    const stats = { summary: r.summary, liked_notes: slim(r.likedN), disliked_notes: slim(r.dislikedN), liked_accords: slim(r.likedA), disliked_accords: slim(r.dislikedA),
      polarizing_notes: r.polarizing.map((a) => a.label), families: r.families, perfumers: r.perfumers, weather: r.weather, occasions: r.occasions.map((o) => ({ occasion: o.occasion, top: o.top.map((x) => x.name) })),
      most_worn: r.mostWorn.map((x) => `${x.brand} ${x.name} (${x.count}x)`), neglected: r.neglected.map((x) => `${x.brand} ${x.name}`) };
    const coll = frags.map((f) => `- ${f.brand || "?"} – ${f.name} [${f.status}, ${f.sentiment === null || f.sentiment === undefined ? "unrated" : SENT[f.sentiment]}, worn ${f.wear_count}x] accords: ${(f.accords || []).slice(0, 4).map((a) => a.name).join(", ")}`).join("\n");
    try {
      const out = await S.sample.json(`You are a perfumery expert helping a collector understand their own taste. Write in second person, warm but precise, like a knowledgeable friend at a perfume counter. Ground every claim in the data below and name specific notes, accords and fragrances from it. Recommend real, currently available perfumes that are NOT already in the collection.

<taste_statistics>
${JSON.stringify(stats)}
</taste_statistics>
<collection>
${coll}
</collection>

Affinity runs from about -2 (hated) to +3 (loved and worn a lot). Write a one-line headline for their scent identity; a narrative of two short paragraphs on what they love, what they avoid and any surprising patterns; 4-6 signature traits; 6 recommendations with why each fits and its key notes; 3 popular fragrances they would likely dislike and why; and 2-4 gaps in the collection (weather, occasions or styles it doesn't cover).

Reply with only JSON shaped like:
${AI_SHAPE}`, { modelTier: "complex", cache: false });
      if (!out || !out.headline) throw { code: "invalid_json" };
      await S.db.doc("profile/latest").set({ ...out, created_at: new Date().toISOString(), example: false });
    } catch (e) { toast(sampleError(e), { error: true }); }
    box.dataset.busy = "";
    renderInsights();
  };
}

/* ============================================================ tooltip */
const tip = $("#tooltip");
document.addEventListener("pointermove", (e) => {
  const el = e.target.closest?.("[data-tip]");
  if (!el) { tip.hidden = true; return; }
  tip.textContent = "";
  el.dataset.tip.split("\n").forEach((line, i) => { if (i) tip.append(document.createElement("br")); tip.append(line); });
  tip.hidden = false;
  const { width, height } = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + width > innerWidth - 8) x = e.clientX - width - 14;
  if (y + height > innerHeight - 8) y = e.clientY - height - 14;
  tip.style.left = `${Math.max(8, x)}px`; tip.style.top = `${Math.max(8, y)}px`;
});

/* ============================================================ boot */
route();
(async () => {
  const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
  S.sample = sample;
  if (!db) { S.status = "nodb"; route(); return; }
  S.db = db;
  let can = null;
  try { can = user ? ((await user.isOwner()) || (await user.can("data.write"))) : null; } catch { can = null; }
  S.canWrite = can !== false;
  const fail = () => { S.status = "nodb"; route(); };
  db.collection("fragrances").onSnapshot((snap) => {
    S.fragrances = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.loaded.f = true; maybeReady();
  }, fail);
  db.collection("wears").onSnapshot((snap) => {
    S.wears = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    S.loaded.w = true; maybeReady();
  }, fail);
  db.doc("profile/latest").onSnapshot((d) => { S.profile = d.exists ? d.data() : null; if (S.status === "ready" && current() === "insights" && $("#ai-card")?.dataset.busy !== "1") renderInsights(); }, () => {});
  function maybeReady() {
    if (S.status !== "ready" && S.loaded.f && S.loaded.w) { S.status = "ready"; route(); return; }
    if (S.status === "ready") { onData(); if (detailId && !$("#detail-body #personal:focus-within") && !$("#detail-body .wear-form:focus-within") && !$("#edit-form")) { const f = findFrag(detailId); if (f) { $("#detail-body").innerHTML = detailView(f); wireDetail(f); } } }
  }
})();
</script>
